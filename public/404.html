<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>No ticket here · The Coney Island Pottsville Arcade</title>
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#1a110c" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      @font-face {
        font-family: "Alfa Slab One";
        src: url("/fonts/AlfaSlabOne-400-latin.woff2") format("woff2");
        font-display: swap;
      }
      @font-face {
        font-family: "Oswald";
        src: url("/fonts/Oswald-var.v1.woff2") format("woff2");
        font-weight: 200 700;
        font-display: swap;
      }
      html {
        min-height: 100%;
        background: #1a110c;
        color: #f3e6c8;
        font-family: "Oswald", "Arial Narrow", sans-serif;
        font-weight: 300;
        font-size: 1.125rem;
        line-height: 1.55;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 3rem 1.25rem 4rem;
        box-sizing: border-box;
      }
      main {
        max-width: 38rem;
        text-align: center;
      }
      .eyebrow {
        margin: 0 0 1rem;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        font-size: 0.8rem;
        color: rgb(243 230 200 / 0.6);
      }
      h1 {
        font-family: "Alfa Slab One", "Arial Black", serif;
        font-weight: 400;
        font-size: clamp(1.75rem, 5vw, 2.5rem);
        line-height: 1.1;
        margin: 0 0 0.5rem;
        color: #f0a13a;
      }
      p {
        margin: 0 0 0.8rem;
      }
      a {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.6rem 1.6rem;
        border: 2px solid #c9a227;
        border-radius: 999px;
        color: #f3e6c8;
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-weight: 500;
      }
      a:hover {
        background: #c9a227;
        color: #1a110c;
      }
      a:focus-visible {
        outline: 2px solid #c9a227;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">The Coney Island Pottsville Arcade</p>
      <h1>No ticket here</h1>
      <p>Nothing hangs at this address.</p>
      <a href="/">Back to the arcade</a>
    </main>
  </body>
</html>
