<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>The Coney Island Pottsville Arcade</title>
    <meta
      name="description"
      content="Free games from The Coney Island in Pottsville, PA: The Maze of Time, Tiki Bar Slots and the Trivia Bowl."
    />
    <meta name="theme-color" content="#1a110c" />
    <link rel="canonical" href="https://arcade.coneyislandpottsville.com/" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Coney Island Pottsville Arcade" />
    <meta property="og:title" content="The Coney Island Pottsville Arcade" />
    <meta
      property="og:description"
      content="Free games from The Coney Island in Pottsville, PA: The Maze of Time, Tiki Bar Slots and the Trivia Bowl."
    />
    <meta property="og:url" content="https://arcade.coneyislandpottsville.com/" />
    <meta property="og:image" content="https://arcade.coneyislandpottsville.com/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Coney Island Pottsville Arcade: three game tickets on a dark wall" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preload" href="/fonts/AlfaSlabOne-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Oswald-var.v1.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main class="sheet">
      <header class="masthead">
        <h1 class="title">
          <span class="venue">The Coney Island Pottsville</span>
          <span class="arcade">Arcade</span>
        </h1>
        <p class="lede">Pick a ticket to play.</p>
        <p class="seal">
          <img src="/src/img/c-mark.svg" width="160" height="160" alt="" />
          <span>Free to play</span>
        </p>
      </header>

      <nav class="tickets" aria-label="Games">
        <a class="ticket" href="https://maze.coneyislandpottsville.com/" style="--i: 0; --glow: var(--orange)">
          <span class="body">
            <picture>
              <source
                type="image/avif"
                srcset="
                  /src/img/maze-480.avif   480w,
                  /src/img/maze-720.avif   720w,
                  /src/img/maze-960.avif   960w,
                  /src/img/maze-1200.avif 1200w,
                  /src/img/maze-1440.avif 1440w,
                  /src/img/maze-1920.avif 1920w
                "
                sizes="(min-width: 900px) calc((min(100vw, 2400px) - min(12vw, 208px)) / 3), (orientation: landscape) and (min-width: 640px) calc((100vw - min(12vw, 208px)) / 3), calc(100vw - 32px)"
              />
              <img
                src="/src/img/maze-1200.webp"
                srcset="
                  /src/img/maze-480.webp   480w,
                  /src/img/maze-720.webp   720w,
                  /src/img/maze-960.webp   960w,
                  /src/img/maze-1200.webp 1200w,
                  /src/img/maze-1440.webp 1440w,
                  /src/img/maze-1920.webp 1920w
                "
                sizes="(min-width: 900px) calc((min(100vw, 2400px) - min(12vw, 208px)) / 3), (orientation: landscape) and (min-width: 640px) calc((100vw - min(12vw, 208px)) / 3), calc(100vw - 32px)"
                width="1200"
                height="630"
                alt="A chef's-hat C over a brick maze"
                fetchpriority="high"
              />
            </picture>
          </span>
          <span class="stub">
            <span class="name">The Maze of Time</span>
            <span class="addr">maze.ConeyIslandPottsville.com</span>
          </span>
        </a>

        <a class="ticket" href="https://slots.coneyislandpottsville.com/" style="--i: 1; --glow: var(--amber)">
          <span class="body">
            <picture>
              <source
                type="image/avif"
                srcset="
                  /src/img/tiki-480.avif   480w,
                  /src/img/tiki-720.avif   720w,
                  /src/img/tiki-960.avif   960w,
                  /src/img/tiki-1200.avif 1200w,
                  /src/img/tiki-1440.avif 1440w,
                  /src/img/tiki-1920.avif 1920w
                "
                sizes="(min-width: 900px) calc((min(100vw, 2400px) - min(12vw, 208px)) / 3), (orientation: landscape) and (min-width: 640px) calc((100vw - min(12vw, 208px)) / 3), calc(100vw - 32px)"
              />
              <img
                src="/src/img/tiki-1200.webp"
                srcset="
                  /src/img/tiki-480.webp   480w,
                  /src/img/tiki-720.webp   720w,
                  /src/img/tiki-960.webp   960w,
                  /src/img/tiki-1200.webp 1200w,
                  /src/img/tiki-1440.webp 1440w,
                  /src/img/tiki-1920.webp 1920w
                "
                sizes="(min-width: 900px) calc((min(100vw, 2400px) - min(12vw, 208px)) / 3), (orientation: landscape) and (min-width: 640px) calc((100vw - min(12vw, 208px)) / 3), calc(100vw - 32px)"
                width="1200"
                height="630"
                alt="A tiki mural beside three slot reels of Coney Island dishes"
                decoding="async"
              />
            </picture>
          </span>
          <span class="stub">
            <span class="name">Tiki Bar Slots</span>
            <span class="addr">slots.ConeyIslandPottsville.com</span>
          </span>
        </a>

        <a class="ticket" href="https://trivia.coneyislandpottsville.com/" style="--i: 2; --glow: var(--gold)">
          <span class="body">
            <picture>
              <source
                type="image/avif"
                srcset="
                  /src/img/trivia-480.avif   480w,
                  /src/img/trivia-720.avif   720w,
                  /src/img/trivia-960.avif   960w,
                  /src/img/trivia-1200.avif 1200w,
                  /src/img/trivia-1440.avif 1440w,
                  /src/img/trivia-1920.avif 1920w
                "
                sizes="(min-width: 900px) calc((min(100vw, 2400px) - min(12vw, 208px)) / 3), (orientation: landscape) and (min-width: 640px) calc((100vw - min(12vw, 208px)) / 3), calc(100vw - 32px)"
              />
              <img
                src="/src/img/trivia-1200.webp"
                srcset="
                  /src/img/trivia-480.webp   480w,
                  /src/img/trivia-720.webp   720w,
                  /src/img/trivia-960.webp   960w,
                  /src/img/trivia-1200.webp 1200w,
                  /src/img/trivia-1440.webp 1440w,
                  /src/img/trivia-1920.webp 1920w
                "
                sizes="(min-width: 900px) calc((min(100vw, 2400px) - min(12vw, 208px)) / 3), (orientation: landscape) and (min-width: 640px) calc((100vw - min(12vw, 208px)) / 3), calc(100vw - 32px)"
                width="1200"
                height="630"
                alt="A Coney Island football on a floodlit field"
                decoding="async"
              />
            </picture>
          </span>
          <span class="stub">
            <span class="name">Trivia Bowl</span>
            <span class="addr">trivia.ConeyIslandPottsville.com</span>
          </span>
        </a>
      </nav>
    </main>
  </body>
</html>
